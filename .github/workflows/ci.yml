name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ******localhost:5432/placeholder

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: '1'
          # Provide minimal placeholders so Next.js can collect page data.
          # Real values are injected at runtime in production.
          KEYCLOAK_CLIENT_ID: build-placeholder
          KEYCLOAK_CLIENT_SECRET: build-placeholder
          KEYCLOAK_ISSUER: https://keycloak.example.com/realms/afterme
          NEXTAUTH_SECRET: 00000000000000000000000000000000
          NEXTAUTH_URL: http://localhost:3000
          DATABASE_URL: ******localhost:5432/afterme
          S3_ACCESS_KEY_ID: build-placeholder
          S3_SECRET_ACCESS_KEY: build-placeholder
          S3_BUCKET_NAME: afterme-vault
          S3_REGION: us-east-1

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ******localhost:5432/placeholder

      - name: Run tests
        run: npm test -- --ci --coverage
        env:
          NODE_ENV: test
          DATABASE_URL: ******localhost:5432/placeholder
          KEYCLOAK_CLIENT_ID: test
          KEYCLOAK_CLIENT_SECRET: test
          KEYCLOAK_ISSUER: https://keycloak.example.com/realms/test
          NEXTAUTH_SECRET: 00000000000000000000000000000000
          S3_ACCESS_KEY_ID: test
          S3_SECRET_ACCESS_KEY: test
          S3_BUCKET_NAME: test-bucket
          S3_REGION: us-east-1

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Audit dependencies
        run: npm audit --audit-level=high
